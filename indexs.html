<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Advanced Toggle Switch</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="wrapper">

    
    <h1>Day ON / OFF Switch</h1>

    <label class="switch">
      <input type="checkbox" id="toggle">

      <div class="slider">

        <div class="cloud"></div>

        <div class="stars">
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div class="circle">
          ☀
        </div>

        <div class="text on">ON</div>
        <div class="text off">OFF</div>

      </div>
    </label>

  </div>

</body>
</html>
